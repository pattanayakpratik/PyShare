<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyShare Login</title>
    <link rel="icon" type="image/x-icon" href="app_icon.ico">
    <link rel="apple-touch-icon" href="app_icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141d2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PyShare">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 18% 18%, rgba(0, 240, 255, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 82% 82%, rgba(168, 85, 247, 0.16) 0%, transparent 50%);
            background-attachment: fixed;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--border-specular);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.12);
            animation: scaleIn 0.25s ease-out;
            box-sizing: border-box;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.4));
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-desc {
            color: var(--text-sub);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .pin-dot-display {
            font-size: 30px;
            letter-spacing: 14px;
            margin-bottom: 24px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding: 12px;
            border-radius: 14px;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .pin-dot-display.error {
            border-color: var(--accent-red);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 16px rgba(244, 63, 94, 0.4);
            animation: shake 0.4s ease-in-out;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key-btn {
            background: var(--keypad-bg);
            border: 1px solid var(--keypad-border);
            border-top: 1px solid var(--keypad-border-top);
            color: var(--keypad-text);
            padding: 16px 0;
            font-size: 20px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: var(--shadow-sm);
        }

        .key-btn:hover {
            background: var(--btn-secondary-hover-bg);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 16px var(--glow-cyan);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: scale(0.95);
            background: rgba(0, 240, 255, 0.25);
        }

        .key-btn-submit {
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #a855f7 100%);
            color: #060913;
            border: none;
            grid-column: span 3;
            margin-top: 4px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: 800;
            border-radius: 9999px;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .key-btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(0, 240, 255, 0.55);
        }

        .key-btn-submit:active {
            transform: scale(0.97);
        }

        /* Light Mode Overrides for Login */
        [data-theme="light"] body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
        }

        [data-theme="light"] .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--border-specular);
            box-shadow: var(--shadow-card);
        }

        [data-theme="light"] .pin-dot-display {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-top: 1px solid #ffffff;
            color: var(--accent-cyan);
            text-shadow: none;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.04);
        }

        [data-theme="light"] .key-btn {
            background: var(--keypad-bg);
            border: 1px solid var(--keypad-border);
            border-top: 1px solid var(--keypad-border-top);
            color: var(--keypad-text);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        }

        [data-theme="light"] .key-btn:hover {
            background: #ffffff;
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        [data-theme="light"] .key-btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #3b82f6 50%, #8b5cf6 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(2, 132, 199, 0.35);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="lock-icon">🔒</div>
        <h2 class="login-title">Protected</h2>
        <p class="login-desc">Enter the 4-digit PIN displayed on the Host.</p>

        <div id="pinBox" class="pin-dot-display"></div>

        <div class="keypad-grid">
            <button class="key-btn" onclick="add('1')">1</button>
            <button class="key-btn" onclick="add('2')">2</button>
            <button class="key-btn" onclick="add('3')">3</button>
            <button class="key-btn" onclick="add('4')">4</button>
            <button class="key-btn" onclick="add('5')">5</button>
            <button class="key-btn" onclick="add('6')">6</button>
            <button class="key-btn" onclick="add('7')">7</button>
            <button class="key-btn" onclick="add('8')">8</button>
            <button class="key-btn" onclick="add('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#8292ab;">C</button>
            <button class="key-btn" onclick="add('0')">0</button>
            <button class="key-btn" onclick="back()" style="color:#8292ab;">⌫</button>
            <button class="key-btn-submit" onclick="submitPin()">Connect</button>
        </div>

        <div style="margin-top: 18px; text-align: center; display: flex; flex-direction: column; gap: 8px;">
            <a href="/guide.html" style="color: #60a5fa; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;">
                <span>❓</span> How to connect &amp; use PyShare
            </a>
            <a href="javascript:void(0)" onclick="openFeedbackModal()" style="color: #8292ab; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px;">
                <span>💬</span> Having trouble? Report issue or get help
            </a>
        </div>
    </div>

    <script>
        let pin = "";
        const pinBox = document.getElementById("pinBox");

        function updateDisplay() {
            let visual = "";
            for (let i = 0; i < 4; i++) {
                if (i < pin.length) {
                    visual += "•";
                } else {
                    visual += '<span style="opacity:0.25;">•</span>';
                }
            }
            pinBox.innerHTML = visual;
        }

        function add(digit) {
            if (pin.length < 4) {
                pin += digit;
                updateDisplay();
                if (pin.length === 4) {
                    setTimeout(submitPin, 250);
                }
            }
        }

        function back() {
            pin = pin.slice(0, -1);
            pinBox.classList.remove('error');
            updateDisplay();
        }

        function clearPin() {
            pin = "";
            pinBox.classList.remove('error');
            updateDisplay();
        }

        async function submitPin() {
            if (!pin || pin.length < 4) return;

            pinBox.style.opacity = "0.5";

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'pin=' + encodeURIComponent(pin)
                });

                pinBox.style.opacity = "1";

                if (res.ok) {
                    window.location.reload();
                } else {
                    pinBox.classList.add('error');
                    pinBox.innerHTML = "<span style='font-size:15px; letter-spacing:1px; color:#ef4444; font-weight:700;'>WRONG PIN</span>";
                    setTimeout(() => {
                        clearPin();
                    }, 1200);
                }
            } catch (e) {
                pinBox.style.opacity = "1";
                pinBox.classList.add('error');
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                add(e.key);
            } else if (e.key === 'Backspace') {
                back();
            } else if (e.key === 'Enter') {
                submitPin();
            } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
                clearPin();
            }
        });

        updateDisplay();
    </script>
    <script src="feedback.js"></script>
</body>
</html>
