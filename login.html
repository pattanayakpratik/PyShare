<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyShare Login</title>
    <link rel="icon" type="image/x-icon" href="app_icon.ico">
    <link rel="apple-touch-icon" href="app_icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141d2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PyShare">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #0b111e;
        }

        .login-card {
            background: #141d2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.25s ease-out;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(234, 179, 8, 0.3));
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .login-desc {
            color: #8292ab;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .pin-dot-display {
            font-size: 30px;
            letter-spacing: 14px;
            margin-bottom: 24px;
            background: #0d1525;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 14px;
            color: #ffffff;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .pin-dot-display.error {
            border-color: #ef4444;
            animation: shake 0.4s ease-in-out;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key-btn {
            background: #182337;
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #ffffff;
            padding: 16px 0;
            font-size: 20px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key-btn:hover {
            background: #202d44;
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: scale(0.95);
            background: rgba(59, 130, 246, 0.2);
        }

        .key-btn-submit {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            border: none;
            grid-column: span 3;
            margin-top: 4px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: 700;
            border-radius: 9999px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .key-btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .key-btn-submit:active {
            transform: scale(0.97);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="lock-icon">🔒</div>
        <h2 class="login-title">Protected</h2>
        <p class="login-desc">Enter the 4-digit PIN displayed on the PC.</p>

        <div id="pinBox" class="pin-dot-display"></div>

        <div class="keypad-grid">
            <button class="key-btn" onclick="add('1')">1</button>
            <button class="key-btn" onclick="add('2')">2</button>
            <button class="key-btn" onclick="add('3')">3</button>
            <button class="key-btn" onclick="add('4')">4</button>
            <button class="key-btn" onclick="add('5')">5</button>
            <button class="key-btn" onclick="add('6')">6</button>
            <button class="key-btn" onclick="add('7')">7</button>
            <button class="key-btn" onclick="add('8')">8</button>
            <button class="key-btn" onclick="add('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#8292ab;">C</button>
            <button class="key-btn" onclick="add('0')">0</button>
            <button class="key-btn" onclick="back()" style="color:#8292ab;">⌫</button>
            <button class="key-btn-submit" onclick="submitPin()">Connect</button>
        </div>

        <div style="margin-top: 20px; text-align: center;">
            <a href="/guide.html" style="color: #60a5fa; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;">
                <span>❓</span> How to connect &amp; use PyShare
            </a>
        </div>
    </div>

    <script>
        let pin = "";
        const pinBox = document.getElementById("pinBox");

        function updateDisplay() {
            let visual = "";
            for (let i = 0; i < 4; i++) {
                if (i < pin.length) {
                    visual += "•";
                } else {
                    visual += '<span style="opacity:0.25;">•</span>';
                }
            }
            pinBox.innerHTML = visual;
        }

        function add(digit) {
            if (pin.length < 4) {
                pin += digit;
                updateDisplay();
                if (pin.length === 4) {
                    setTimeout(submitPin, 250);
                }
            }
        }

        function back() {
            pin = pin.slice(0, -1);
            pinBox.classList.remove('error');
            updateDisplay();
        }

        function clearPin() {
            pin = "";
            pinBox.classList.remove('error');
            updateDisplay();
        }

        async function submitPin() {
            if (!pin || pin.length < 4) return;

            pinBox.style.opacity = "0.5";

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'pin=' + encodeURIComponent(pin)
                });

                pinBox.style.opacity = "1";

                if (res.ok) {
                    window.location.reload();
                } else {
                    pinBox.classList.add('error');
                    pinBox.innerHTML = "<span style='font-size:15px; letter-spacing:1px; color:#ef4444; font-weight:700;'>WRONG PIN</span>";
                    setTimeout(() => {
                        clearPin();
                    }, 1200);
                }
            } catch (e) {
                pinBox.style.opacity = "1";
                pinBox.classList.add('error');
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                add(e.key);
            } else if (e.key === 'Backspace') {
                back();
            } else if (e.key === 'Enter') {
                submitPin();
            } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
                clearPin();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
