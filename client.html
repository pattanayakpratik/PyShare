<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyShare Client</title>
    <link rel="icon" type="image/x-icon" href="app_icon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="client_styles.css">
</head>
<body>
    <div class="app-container">

        <!-- Top Navbar -->
        <nav class="navbar">
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
            <div class="logo">
                <img src="app_icon.ico" alt="PyShare" style="width:28px; height:28px; border-radius:6px;">
                PyShare
            </div>
            <div style="width: 42px;"></div>
        </nav>

        <!-- Connected Status Indicator -->
        <div class="status-bar" style="margin-bottom: 0;">
            <div class="client-status-pill">
                <span class="status-dot"></span>
                <span>Connected to PC</span>
            </div>
        </div>

        <!-- 1. Send to PC Dropzone -->
        <div class="client-upload-card card-panel" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="cloud-icon">☁️</div>
            <h3 class="client-upload-title">Send to PC</h3>
            <p class="client-upload-sub">Tap here to upload files</p>
            <button class="btn-primary" type="button" style="pointer-events:none;">
                Browse Files
            </button>
            <input type="file" id="fileInput" multiple hidden onchange="handleFiles(this.files)">
        </div>

        <!-- 2. Shared Clipboard Card -->
        <div class="card-panel" style="padding: 14px 16px;">
            <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">
                <span>📋 Quick Clipboard</span>
            </div>
            <div id="clipboardCurrent" style="font-size: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <span style="color: var(--text-sub);">Loading clipboard...</span>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input type="text" id="clipboardInput" placeholder="Share text or link with PC..." class="search-input-box" style="margin-bottom: 0; padding: 8px 12px; font-size: 12px; flex: 1; min-width: 0;" onkeydown="if(event.key==='Enter') sendClipboard()">
                <button class="btn-primary" onclick="sendClipboard()" style="padding: 8px 16px; font-size: 12px; border-radius: 8px; flex-shrink: 0;">Send</button>
            </div>
        </div>

        <!-- 3. Download from PC Section -->
        <div class="card-panel" style="padding: 16px 16px; flex: 1;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 12px;">
                <h3 style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    <span>💾 Download from PC</span>
                </h3>
                <a href="/api/zip?folder=shared" class="btn-secondary" style="padding: 4px 10px; font-size: 11px; flex-shrink: 0;" title="Download all files as ZIP">📦 ZIP All</a>
            </div>

            <input type="text" id="searchPC" class="search-input-box" placeholder="🔍 Search PC files..." onkeyup="renderPCFiles()">

            <ul id="file-list" class="file-list">
                <li class="empty-state">Loading files...</li>
            </ul>
        </div>

    </div>

    <!-- Floating Upload Queue Drawer -->
    <div id="floatingQueue" class="floating-queue">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700;">
            <span id="queueOverallStatus">Uploading to PC...</span>
            <span id="queueSpeed" style="color:var(--accent-cyan); font-family:monospace; font-size:12px;">0 KB/s</span>
        </div>
        <div id="queueItemsList" style="display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto;"></div>
    </div>

    <!-- In-App Lightbox Media Preview Modal -->
    <div id="previewModal" class="modal-backdrop" onclick="if(event.target===this) closePreview()">
        <div class="modal-box">
            <div class="modal-header">
                <span id="previewModalTitle" class="modal-title-text">File Preview</span>
                <button class="icon-btn" onclick="closePreview()" style="width:34px; height:34px;" title="Close">✕</button>
            </div>
            <div id="previewModalBody" class="modal-content-area"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closePreview()">Close</button>
                <a id="previewDownloadBtn" href="#" class="btn-primary" style="padding:10px 24px; font-size:13px;">⬇️ Download File</a>
            </div>
        </div>
    </div>

    <!-- Disconnect Overlay -->
    <div id="disconnectOverlay" class="disconnect-overlay">
        <div class="disconnect-modal-card">
            <div style="font-size: 48px; margin-bottom: 14px;">🔌</div>
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Disconnected</h2>
            <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 24px; line-height: 1.4;">The host has stopped the server or connection was lost.</p>
            <button class="btn-primary" onclick="window.location.reload()">Try Reconnect</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts.js"></script>
    <script>
        let failCount = 0;
        const overlay = document.getElementById('disconnectOverlay');

        setInterval(async () => {
            try {
                const res = await fetch('/api/files');
                if (!res.ok) throw new Error("Server error");
                failCount = 0;
                overlay.classList.remove('visible');
            } catch (e) {
                failCount++;
                if (failCount >= 3) {
                    overlay.classList.add('visible');
                }
            }
        }, 1500);

        setInterval(() => {
            loadClipboard();
        }, 3000);
    </script>
</body>
</html>
