<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PyShare Login</title>
    <link rel="icon" type="image/x-icon" href="app_icon.ico">
    <link rel="apple-touch-icon" href="app_icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141d2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PyShare">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 18% 18%, rgba(0, 240, 255, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 82% 82%, rgba(168, 85, 247, 0.16) 0%, transparent 50%);
            background-attachment: fixed;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-top: 1px solid var(--border-specular);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.12);
            animation: scaleIn 0.25s ease-out;
            box-sizing: border-box;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.4));
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-desc {
            color: var(--text-sub);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .pin-dot-display {
            font-size: 30px;
            letter-spacing: 14px;
            margin-bottom: 24px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding: 12px;
            border-radius: 14px;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .pin-dot-display.error {
            border-color: var(--accent-red);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 16px rgba(244, 63, 94, 0.4);
            animation: shake 0.4s ease-in-out;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key-btn {
            background: var(--keypad-bg);
            border: 1px solid var(--keypad-border);
            border-top: 1px solid var(--keypad-border-top);
            color: var(--keypad-text);
            padding: 16px 0;
            font-size: 20px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: var(--shadow-sm);
        }

        .key-btn:hover {
            background: var(--btn-secondary-hover-bg);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 16px var(--glow-cyan);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: scale(0.95);
            background: rgba(0, 240, 255, 0.25);
        }

        .key-btn-submit {
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #a855f7 100%);
            color: #060913;
            border: none;
            grid-column: span 3;
            margin-top: 4px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: 800;
            border-radius: 9999px;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .key-btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(0, 240, 255, 0.55);
        }

        .key-btn-submit:active {
            transform: scale(0.97);
        }

        /* Light Mode Overrides for Login */
        [data-theme="light"] body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-top: 1px solid #ffffff;
            box-shadow: 0 24px 60px -8px rgba(15, 23, 42, 0.12), 0 0 30px rgba(37, 99, 235, 0.08), inset 0 1px 0 #ffffff;
        }

        [data-theme="light"] .pin-dot-display {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(241, 245, 249, 0.85) 100%);
            border: 1px solid rgba(203, 213, 225, 0.85);
            border-top: 1px solid #ffffff;
            color: #2563eb;
            text-shadow: 0 0 12px rgba(37, 99, 235, 0.3);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04), inset 0 1px 0 #ffffff;
            border-radius: 18px;
        }

        [data-theme="light"] .key-btn {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-top: 1px solid #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 0 #ffffff;
            border-radius: 16px;
        }

        [data-theme="light"] .key-btn:hover {
            background: #ffffff;
            border-color: rgba(37, 99, 235, 0.4);
            color: #2563eb;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.15), inset 0 1px 0 #ffffff;
            transform: translateY(-2px);
        }

        [data-theme="light"] .key-btn:active {
            background: rgba(241, 245, 249, 0.95);
            transform: translateY(1px);
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        }

        [data-theme="light"] .key-btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>
    <!-- Top return bar for Host PC -->
    <div id="hostReturnBar" style="display: none; position: fixed; top: 16px; left: 20px; right: 20px; justify-content: space-between; align-items: center; z-index: 100;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 9999px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 13px; font-weight: 600; text-decoration: none; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); transition: all 0.2s; box-shadow: var(--shadow-sm);">
            <span>←</span> <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Return to Rooms</span>
        </a>
        <button class="key-btn" onclick="toggleLoginTheme()" style="width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;" title="Toggle Theme" aria-label="Toggle Theme">
            <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <div class="login-card">
        <div class="lock-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <h2 class="login-title">Protected</h2>
        <p class="login-desc">Enter the 4-digit PIN displayed on the Host.</p>

        <div id="pinBox" class="pin-dot-display"></div>

        <div class="keypad-grid">
            <button class="key-btn" onclick="add('1')">1</button>
            <button class="key-btn" onclick="add('2')">2</button>
            <button class="key-btn" onclick="add('3')">3</button>
            <button class="key-btn" onclick="add('4')">4</button>
            <button class="key-btn" onclick="add('5')">5</button>
            <button class="key-btn" onclick="add('6')">6</button>
            <button class="key-btn" onclick="add('7')">7</button>
            <button class="key-btn" onclick="add('8')">8</button>
            <button class="key-btn" onclick="add('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#8292ab;">C</button>
            <button class="key-btn" onclick="add('0')">0</button>
            <button class="key-btn" onclick="back()" style="color:#8292ab;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
            <button class="key-btn-submit" onclick="submitPin()">Connect</button>
        </div>

        <div id="hostReturnCardBtn" style="display: none; margin-top: 14px;">
            <a href="/" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 14px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s;">
                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Return to Rooms</span>
            </a>
        </div>

        <div style="margin-top: 18px; text-align: center; display: flex; flex-direction: column; gap: 8px;">
            <a href="/guide.html" style="color: #60a5fa; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;">
                <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> How to connect &amp; use PyShare
            </a>
            <a href="javascript:void(0)" onclick="openFeedbackModal()" style="color: #8292ab; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px;">
                <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Having trouble? Report issue or get help
            </a>
        </div>
    </div>

    <script>
        // Theme Switcher Logic
        (function initTheme() {
            const urlTheme = new URLSearchParams(window.location.search).get('theme');
            const saved = urlTheme || localStorage.getItem('pyshare_theme') || document.documentElement.getAttribute('data-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            if (urlTheme) {
                try { localStorage.setItem('pyshare_theme', urlTheme); } catch(e) {}
            }
        })();

        let pin = "";
        const pinBox = document.getElementById("pinBox");

        function updateDisplay() {
            let visual = "";
            for (let i = 0; i < 4; i++) {
                if (i < pin.length) {
                    visual += "•";
                } else {
                    visual += '<span style="opacity:0.25;">•</span>';
                }
            }
            pinBox.innerHTML = visual;
        }

        function add(digit) {
            if (pin.length < 4) {
                pin += digit;
                updateDisplay();
                if (pin.length === 4) {
                    setTimeout(submitPin, 250);
                }
            }
        }

        function back() {
            pin = pin.slice(0, -1);
            pinBox.classList.remove('error');
            updateDisplay();
        }

        function clearPin() {
            pin = "";
            pinBox.classList.remove('error');
            updateDisplay();
        }

        async function submitPin() {
            if (!pin || pin.length < 4) return;

            pinBox.style.opacity = "0.5";

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'pin=' + encodeURIComponent(pin)
                });

                pinBox.style.opacity = "1";

                if (res.ok) {
                    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/client'; window.location.href = nextUrl;
                } else {
                    pinBox.classList.add('error');
                    if (res.status === 429) {
                        const errTxt = await res.text();
                        pinBox.innerHTML = "<span style='font-size:11px; letter-spacing:0px; color:#ef4444; font-weight:700;'>" + (errTxt || 'LOCKED OUT') + "</span>";
                    } else {
                        pinBox.innerHTML = "<span style='font-size:15px; letter-spacing:1px; color:#ef4444; font-weight:700;'>WRONG PIN</span>";
                    }
                    setTimeout(() => {
                        clearPin();
                    }, 1500);
                }
            } catch (e) {
                pinBox.style.opacity = "1";
                pinBox.classList.add('error');
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                add(e.key);
            } else if (e.key === 'Backspace') {
                back();
            } else if (e.key === 'Enter') {
                submitPin();
            } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
                clearPin();
            }
        });

        function toggleLoginTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('pyshare_theme', next); } catch(e) {}
        }

        // Show Return to Rooms if running on Host machine (localhost/127.0.0.1 or verified host)
        function showHostReturnControls() {
            const bar = document.getElementById('hostReturnBar');
            const cardBtn = document.getElementById('hostReturnCardBtn');
            if (bar) bar.style.display = 'flex';
            if (cardBtn) cardBtn.style.display = 'block';
        }

        if (['127.0.0.1', 'localhost', '::1'].includes(window.location.hostname)) {
            showHostReturnControls();
        }

        fetch('/api/info')
            .then(r => r.json())
            .then(data => {
                if (data && data.is_host) {
                    showHostReturnControls();
                }
            })
            .catch(() => {});

        // Auto-fill and submit PIN if passed in URL query param (?pin=1234)
        const urlPin = new URLSearchParams(window.location.search).get('pin');
        if (urlPin && /^\d{4}$/.test(urlPin)) {
            pin = urlPin;
            updateDisplay();
            setTimeout(submitPin, 300);
        } else {
            updateDisplay();
        }
    </script>
    <script src="feedback.js"></script>
</body>
</html>
